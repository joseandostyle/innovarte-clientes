<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
</head>
<body style="margin:0">
<title>Guía Tono e Hijo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14212B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Concepto: el cartel «SE VENDE» del balcón (amarillo y tinta) sobre papel de plano; app con páginas propias y barra abajo en el móvil */
:root{
  --papel:#F5F6F3; --hoja:#FFFFFF; --tinta:#14212B; --suave:#56636D; --linea:#DCE1E2; --hueco:#ECEFEC;
  --cartel:#F2C230; --cartel-tinta:#14212B; --sello:#B3261E; --ok:#2E7D4F; --ok-fondo:#E3F1E8; --mal-fondo:#F8E4E2;
  --fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --fb:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#0F171D; --hoja:#16222A; --tinta:#E8EDEF; --suave:#9AA8B1; --linea:#2A3943; --hueco:#1C2a33;
  --sello:#F07A70; --ok:#6FCB95; --ok-fondo:#173326; --mal-fondo:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --papel:#0F171D; --hoja:#16222A; --tinta:#E8EDEF; --suave:#9AA8B1; --linea:#2A3943; --hueco:#1C2a33;
  --sello:#F07A70; --ok:#6FCB95; --ok-fondo:#173326; --mal-fondo:#3A1C1A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--papel);color:var(--tinta);font:16px/1.55 var(--fb);margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--tinta)}
h1,h2,h3{font-family:var(--fd);font-weight:700;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:2.3rem;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:1.6rem;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:1.25rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:3px solid var(--cartel);outline-offset:2px}
.etq{font:600 .72rem/1.2 var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--suave)}
.suave{color:var(--suave)}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.supuesto,.comprobar{display:inline-block;font:600 .64rem/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;vertical-align:2px;white-space:nowrap}
.supuesto{border:1px dashed var(--suave);color:var(--suave)}
.comprobar{border:1px solid var(--sello);color:var(--sello)}

/* barra de arriba */
.barra-sup{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--tinta);color:#fff}
.barra-sup .in{max-width:880px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:10px;min-height:56px}
.atras{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:#fff;padding:8px 8px 8px 2px;cursor:pointer;font-weight:600}
.atras svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.marca{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;min-width:0}
.marca b{background:var(--cartel);color:var(--cartel-tinta);font:700 1.05rem/1 var(--fd);text-transform:uppercase;padding:6px 8px 5px;letter-spacing:.03em;white-space:nowrap}
.titulo-sup{font:700 1.15rem/1.1 var(--fd);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.socio{margin-left:auto;display:flex;border:1px solid rgba(255,255,255,.35)}
.socio button{background:none;border:0;color:#fff;padding:7px 11px;cursor:pointer;font-weight:600;font-size:.88rem}
.socio button[aria-pressed="true"]{background:var(--cartel);color:var(--cartel-tinta)}

main{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:grid;gap:22px}
main>*{min-width:0}
.pagina-entra{animation:entra .22s ease-out}
@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* barra de abajo */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--hoja);border-top:1px solid var(--linea);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;text-decoration:none;color:var(--suave);font:600 .7rem/1 var(--fb)}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a[aria-current="page"]{color:var(--tinta);box-shadow:inset 0 3px 0 var(--cartel)}
@media (min-width:880px){
  nav.tabs{left:50%;transform:translateX(-50%);bottom:16px;width:560px;border:1px solid var(--linea);box-shadow:0 8px 24px rgba(20,33,43,.12)}
}

/* piezas */
.tarjeta{background:var(--hoja);border:1px solid var(--linea);padding:18px;display:grid;gap:12px}
.tarjeta.cartel{background:var(--cartel);color:var(--cartel-tinta);border:2px solid var(--cartel-tinta)}
.tarjeta.cartel .etq{color:var(--cartel-tinta)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.acceso{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-decoration:none;background:var(--hoja);border:1px solid var(--linea);padding:14px;transition:border-color .15s,transform .15s}
.acceso:hover{border-color:var(--tinta)}
.acceso:active{transform:scale(.99)}
.acceso .ico{width:44px;height:44px;display:grid;place-items:center;background:var(--hueco)}
.acceso .ico svg{width:24px;height:24px;stroke:var(--tinta);fill:none;stroke-width:1.8}
.acceso b{font-family:var(--fd);font-size:1.2rem;display:block;line-height:1.1}
.acceso span.d{font-size:.84rem;color:var(--suave)}
.flecha{width:18px;height:18px;stroke:var(--suave);fill:none;stroke-width:2}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--tinta);background:var(--tinta);color:var(--papel);padding:11px 16px;cursor:pointer;font-weight:600;text-decoration:none;min-height:46px}
.boton.sec{background:transparent;color:var(--tinta)}
.boton.amarillo{background:var(--cartel);border-color:var(--cartel-tinta);color:var(--cartel-tinta)}
.boton.peligro{background:var(--sello);border-color:var(--sello);color:#fff}
.boton:active{transform:scale(.98)}
.boton[disabled]{opacity:.45;cursor:not-allowed}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.entre{justify-content:space-between}
.barra-p{height:8px;background:var(--hueco);flex:1;min-width:80px}
.barra-p i{display:block;height:100%;background:var(--tinta);transition:width .3s}
.barra-p.ok i{background:var(--ok)}
ul.lista{margin:0;padding-left:1.15rem;display:grid;gap:8px}
ol.pasos{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;gap:10px}
ol.pasos li{counter-increment:p;display:grid;grid-template-columns:30px 1fr;gap:10px}
ol.pasos li::before{content:counter(p);font:700 1.1rem/30px var(--fd);text-align:center;background:var(--tinta);color:var(--papel);height:30px}
.segmentos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.segmentos button{border:1px solid var(--linea);background:var(--hoja);padding:10px;text-align:left;cursor:pointer;min-height:64px}
.segmentos b{display:block;font-family:var(--fd);font-size:1.05rem;text-transform:uppercase;line-height:1.1}
.segmentos span{font-size:.75rem;color:var(--suave)}
.segmentos button[aria-pressed="true"]{border:2px solid var(--tinta);background:var(--cartel);color:var(--cartel-tinta)}
.segmentos button[aria-pressed="true"] span{color:var(--cartel-tinta)}
@media (max-width:520px){.segmentos{gap:6px}.segmentos button{min-height:0;padding:9px 8px}.segmentos b{font-size:.95rem}.segmentos span{display:none}}

/* hoy */
.tareas{list-style:none;margin:0;padding:0;display:grid}
.tareas li{border-top:1px solid var(--linea)}
.tareas li:first-child{border-top:0}
.tareas label{display:grid;grid-template-columns:26px 6.3rem 1fr;gap:10px;padding:12px 0;cursor:pointer;align-items:start}
.tareas input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok)}
.tareas .h{font-family:var(--fm);font-size:.82rem;color:var(--suave);padding-top:3px}
.tareas b{display:block}
.tareas .tx{font-size:.92rem;color:var(--suave)}
.tareas input:checked~div b{text-decoration:line-through;color:var(--suave)}
@media (max-width:440px){.tareas label{grid-template-columns:26px 1fr}.tareas .h{grid-column:2}.tareas label>div{grid-column:2}}
.contadores{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.cont{border:1px solid var(--linea);padding:12px;display:grid;gap:8px;background:var(--hoja)}
.cont .v{font:500 1.8rem/1 var(--fm);font-variant-numeric:tabular-nums}
.cont .v small{font-size:.8rem;color:var(--suave)}
.cont .bot{display:flex;gap:6px}
.cont .bot button{width:46px;height:46px;border:1px solid var(--linea);background:var(--papel);cursor:pointer;font-size:1.3rem;font-weight:600}
.cont .bot button.mas{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.cont.hecho{border-color:var(--ok)}

/* módulos */
.mod-item{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-decoration:none;background:var(--hoja);border:1px solid var(--linea);padding:12px 14px}
.mod-item:hover{border-color:var(--tinta)}
.mod-item .n{font:700 1.9rem/1 var(--fd);color:var(--suave);text-align:center}
.mod-item.hecho .n{color:var(--ok)}
.mod-item b{font-family:var(--fd);font-size:1.2rem;display:block;line-height:1.1}
.estado{font:600 .68rem/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;white-space:nowrap}
.estado.ok{background:var(--ok-fondo);color:var(--ok)}
.estado.medio{background:var(--hueco);color:var(--tinta)}
.cab-mod{display:grid;gap:10px}
.cab-mod .n{font:700 4rem/0.85 var(--fd);color:var(--cartel);-webkit-text-stroke:2px var(--tinta)}
.indice{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.indice a{flex:0 0 auto;text-decoration:none;border:1px solid var(--linea);background:var(--hoja);padding:7px 11px;font-weight:600;font-size:.86rem}
.indice a.hecho{border-color:var(--ok);color:var(--ok)}
.pregunta{display:grid;gap:8px;border-top:1px solid var(--linea);padding-top:14px}
.pregunta:first-of-type{border-top:0;padding-top:0}
.opcion{display:block;width:100%;text-align:left;border:1px solid var(--linea);background:var(--papel);padding:12px 14px;cursor:pointer;min-height:48px}
.opcion:hover{border-color:var(--tinta)}
.opcion.bien{background:var(--ok-fondo);border-color:var(--ok);font-weight:600}
.opcion.mal{background:var(--mal-fondo);border-color:var(--sello)}
.explica{font-size:.92rem;padding:10px 12px;border-left:3px solid var(--ok);background:var(--hoja)}
.explica.mal{border-left-color:var(--sello)}
.ejercicio{background:var(--cartel);color:var(--cartel-tinta);border:2px solid var(--cartel-tinta);padding:16px;display:grid;gap:10px}
.ejercicio .etq{color:var(--cartel-tinta)}
textarea{width:100%;min-height:96px;border:1px solid var(--linea);background:var(--hoja);color:var(--tinta);padding:10px;resize:vertical}
.ejercicio textarea{border-color:var(--cartel-tinta);background:#fff;color:#14212B}
.check-grande{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check-grande input{width:24px;height:24px;accent-color:var(--cartel-tinta)}
.navmod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navmod a{text-decoration:none;border:1px solid var(--linea);background:var(--hoja);padding:12px;display:grid;gap:2px}
.navmod a:last-child{text-align:right}
.navmod b{font-family:var(--fd);font-size:1.05rem}

/* practicar */
.tarjeta-obj{background:var(--hoja);border:2px solid var(--tinta);padding:22px 18px;display:grid;gap:14px;min-height:260px;align-content:start}
.tarjeta-obj .frase{font:700 1.9rem/1.1 var(--fd)}
.respuesta{border-top:1px dashed var(--linea);padding-top:14px}
.texto-guion{white-space:pre-line;background:var(--hoja);border:1px solid var(--linea);padding:16px;font-size:1rem;line-height:1.65}
.texto-guion.grande{font-size:1.2rem}

/* calculadoras */
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.campo{display:grid;gap:4px}
.campo label{font-size:.82rem;font-weight:600;color:var(--suave)}
.campo input,.campo select{width:100%;border:1px solid var(--linea);background:var(--hoja);padding:10px;min-height:46px}
.resultado{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.dato{background:var(--hueco);padding:12px;display:grid;gap:2px}
.dato .v{font:500 1.35rem/1.15 var(--fm);font-variant-numeric:tabular-nums}
.dato.fuerte{background:var(--tinta);color:var(--papel)}
.dato.fuerte .etq{color:var(--papel);opacity:.8}
.testigos{display:grid;gap:8px}
.testigo{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:end}
.testigo button{height:46px;border:1px solid var(--linea);background:var(--hoja);cursor:pointer}

/* papeles */
.checks{list-style:none;margin:0;padding:0;display:grid}
.checks li{border-top:1px solid var(--linea)}
.checks li:first-child{border-top:0}
.checks label{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:12px 0;cursor:pointer}
.checks input{width:22px;height:22px;margin-top:1px;accent-color:var(--ok)}
.checks small{display:block;color:var(--suave);margin-top:3px;font-size:.88rem}
.op{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-decoration:none;background:var(--hoja);border:1px solid var(--linea);padding:12px 14px}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:10px 8px;border-top:1px solid var(--linea)}
th{font:600 .7rem/1.2 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--suave);border-top:0}
.decision{border-top:1px solid var(--linea);padding-top:12px;display:grid;gap:6px}
.decision:first-child{border-top:0;padding-top:0}
.decision summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.decision summary::-webkit-details-marker{display:none}
.decision summary b{font-family:var(--fd);font-size:1.15rem;flex:1}
.semana{list-style:none;margin:0;padding:0;display:grid}
.semana li{border-top:1px solid var(--linea)}
.semana li:first-child{border-top:0}
.semana label{display:grid;grid-template-columns:26px 5.4rem 1fr;gap:10px;padding:11px 0;cursor:pointer}
.semana input{width:22px;height:22px;accent-color:var(--ok)}
.semana .d{font:700 1.05rem/1.3 var(--fd);text-transform:uppercase}
@media (max-width:440px){.semana label{grid-template-columns:26px 1fr}.semana label>span:last-child{grid-column:2}}
.aviso{font-size:.84rem;color:var(--suave);border-top:1px solid var(--linea);padding-top:12px}
.fuentes a{color:var(--suave)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:10px 16px;font-weight:600;z-index:50;transition:opacity .2s;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .barra-sup,nav.tabs,.toast,.no-imprimir{display:none!important}
  body{background:#fff}
  main{padding-block:0}
  .tarjeta,.pregunta,.mod-imp{break-inside:avoid}
  .salto{break-before:page}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<header class="barra-sup">
  <div class="in">
    <button class="atras" type="button" id="atras" hidden aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <a class="marca" href="#inicio" id="marca"><b>Tono e Hijo</b></a>
    <span class="titulo-sup" id="titulo-sup" hidden></span>
    <div class="socio" role="group" aria-label="Quién eres">
      <button type="button" data-socio="Tono">Tono</button>
      <button type="button" data-socio="Carlos">Carlos</button>
    </div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<nav class="tabs" aria-label="Secciones">
  <a href="#inicio" data-sec="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>Inicio</a>
  <a href="#formacion" data-sec="formacion"><svg viewBox="0 0 24 24"><path d="M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z"/></svg>Formación</a>
  <a href="#practicar" data-sec="practicar"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg>Practicar</a>
  <a href="#calculadoras" data-sec="calculadoras"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18"/><path d="M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2M16 11v6"/></svg>Calcular</a>
  <a href="#papeles" data-sec="papeles"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12l2 2 4-4"/></svg>Papeles</a>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ================= almacenamiento (en este aparato) ================= */
function S(k, d){ try{ var v = localStorage.getItem('teh2:' + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }
function G(k, v){ try{ localStorage.setItem('teh2:' + k, JSON.stringify(v)); }catch(e){} }
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* [s] = supuesto, [c] = comprobar, **negrita** */
function md(t){ return esc(t).replace(/\[s\]/g,'<span class="supuesto">supuesto</span>').replace(/\[c\]/g,'<span class="comprobar">comprobar</span>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function eur(n){ return isFinite(n) ? Math.round(n).toLocaleString('es-ES') + ' €' : '—'; }
function hoyClave(){ var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function semanaClave(){ var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); var w1 = new Date(d.getFullYear(), 0, 4); return d.getFullYear() + '-s' + (1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7)); }
function toast(t){ var e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function(){ e.hidden = true; }, 1800); }
var I = {
  flecha:'<svg class="flecha" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  dia:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

var MODULOS = [
 {n:1,f:0,t:'Lo legal y los documentos',dur:'2 sesiones de 45 min',
  obj:'Saber qué podéis hacer, qué firmar en cada momento y qué no hay que hacer nunca.',
  claves:['**Registro de Agentes de la Comunitat Valenciana**: sin inscripción no se puede intermediar. El número va en toda la publicidad (ver Papeles).','**Nota de encargo**: el contrato con el propietario. Precio de salida, honorarios, duración, si es en exclusiva y cómo se termina. Un modelo revisado por un abogado y siempre el mismo.','**Hoja de visita**: la firma el comprador en cada visita. Prueba que llegó por vosotros.','**Reserva y arras**: la reserva aparta el piso. Las arras penitenciales (art. 1454 del Código Civil) dejan echarse atrás: el comprador pierde lo entregado o el vendedor lo devuelve doble. Las confirmatorias son un pago a cuenta. Siempre por escrito y diciendo de qué tipo son.','**Nota simple** del Registro de la Propiedad antes de captar: dueño, cargas, hipotecas, embargos.','**Certificado de eficiencia energética**: obligatorio para anunciar; la etiqueta va en el anuncio.'],
  pasos:['Pedid a un abogado modelos de nota de encargo (con y sin exclusiva), hoja de visita, oferta, reserva y arras.','Guardadlos en el móvil y en papel: siempre los mismos.','Antes de cada captación, pedid la nota simple.','No enseñéis ni anunciéis nada sin nota de encargo firmada.'],
  errores:['Enseñar un piso sin nota de encargo firmada.','Cobrar dinero a cuenta sin un documento que diga qué es y qué pasa si se cae la venta.','Captar sin nota simple y enterarse del embargo en la notaría.'],
  test:[['¿Qué tiene que estar firmado antes de anunciar o enseñar un piso?',['El contrato de arras','La nota de encargo','La hoja de visita'],1,'La nota de encargo es vuestro contrato con el propietario. Sin ella no podéis anunciar ni reclamar honorarios.'],
        ['Con arras penitenciales, si el comprador se echa atrás…',['Recupera todo lo que pagó','Pierde lo que entregó','Tiene que pagar el doble'],1,'Pierde lo entregado. Si el que se echa atrás es el vendedor, devuelve el doble (art. 1454 del Código Civil).'],
        ['¿Qué documento dice quién es el dueño y si hay cargas?',['La nota simple del Registro','El certificado energético','El recibo del IBI'],0,'La nota simple: titulares, hipotecas, embargos y otras cargas.']],
  ej:'Rellenad entre los dos la nota de encargo, una hoja de visita y unas arras de un piso inventado. Apuntad aquí las dudas para el abogado.'},
 {n:2,f:0,t:'Blanqueo de capitales y datos personales',dur:'1 sesión de 45 min',
  obj:'Cumplir dos obligaciones que casi todas las agencias pequeñas olvidan hasta que llega una inspección.',
  claves:['Las agencias inmobiliarias son **sujetos obligados** de la Ley 10/2010 de prevención del blanqueo de capitales.','En cada operación: **identificar al cliente** (DNI; en sociedades, quién está detrás), preguntar de dónde sale el dinero si algo no cuadra y **guardar los documentos** [c].','Formación en prevención del blanqueo y un responsable ante el SEPBLAC. Si el manual interno es obligatorio para una agencia de dos personas depende del tamaño [c].','**Efectivo**: en España no se pueden pagar en efectivo 1.000 € o más cuando interviene un empresario o profesional (Ley 7/2012).','**Datos personales (RGPD)**: a cada contacto que guardáis hay que decirle quién guarda sus datos y para qué. Un texto corto en la hoja de visita y en la web.','**Llamadas comerciales**: desde el 29/06/2023 hace falta consentimiento previo o un interés legítimo justificado (Ley 11/2022 y Circular 1/2023 de la AEPD). Llamar en frío a listas de particulares es arriesgado [c]. Por eso esta guía capta sobre todo en persona.'],
  pasos:['Preguntad a la gestoría o a un asesor de blanqueo qué os toca exactamente.','Haced una carpeta por operación con las copias de DNI y los papeles.','Poned el texto de protección de datos en la hoja de visita.','Decidid con un abogado cómo contactar a particulares.'],
  errores:['Aceptar pagos grandes en efectivo sin preguntar.','Llamar a una lista de teléfonos sacada de los portales.','Guardar los contactos solo en el WhatsApp personal.'],
  test:[['¿Las inmobiliarias están obligadas por la ley de blanqueo de capitales?',['Sí, son sujetos obligados','Solo las de más de 10 empleados','No, solo los bancos'],0,'Sí: la Ley 10/2010 incluye a las agencias y agentes inmobiliarios.'],
        ['Desde junio de 2023, para llamar a un particular y ofrecerle vuestros servicios…',['Basta con que su número esté en un portal','Hace falta su consentimiento previo o un interés legítimo justificado','No hay ningún límite'],1,'La Ley 11/2022 y la Circular 1/2023 de la AEPD lo exigen. Consultadlo con un abogado antes de llamar en frío.'],
        ['Un comprador quiere pagar 3.000 € de reserva en efectivo. ¿Qué hacéis?',['Aceptarlo sin más','No se puede: con un profesional de por medio el límite está por debajo de 1.000 €','Aceptarlo si firma un recibo'],1,'Con un empresario o profesional de por medio, no se pueden pagar en efectivo 1.000 € o más. Mejor transferencia, que además deja rastro.']],
  ej:'Apuntad aquí la respuesta de la gestoría: qué os toca hacer a vosotros por el blanqueo de capitales.'},
 {n:3,f:0,t:'Valorar un piso',dur:'2 sesiones y práctica',
  obj:'Dar un precio defendible con datos, porque el precio es lo que más decide si un piso se vende.',
  claves:['**Testigos**: de 5 a 8 pisos parecidos de la misma zona. Mejor vendidos que anunciados: el anuncio es lo que se pide, no lo que se paga.','**Ajustes**: planta y ascensor, estado (para entrar o reformar), orientación, terraza, garaje, año del edificio.','**Tres precios**: el de salida, el de cierre esperado y el mínimo del propietario.','**Precio caro = piso quemado**: tras 6–8 semanas sin visitas, los compradores lo descartan y luego cuesta más bajarlo [s].','Entregar la valoración **por escrito**, con los testigos.'],
  pasos:['Buscad testigos de la misma zona y tipo (calculadora de valoración).','Pasad todo a precio por m² y ajustad por lo que lo hace mejor o peor.','Sacad un rango, no un número.','Preparad la hoja con testigos para enseñarla al propietario.'],
  errores:['Subir el precio para conseguir la captación.','Usar solo anuncios como testigos.','No preguntar qué necesita sacar el propietario y para cuándo.'],
  test:[['¿Cuál es el mejor testigo para valorar?',['Un piso parecido ya vendido en la zona','El anuncio más caro de la calle','Lo que pide el propietario'],0,'Lo vendido es lo que la gente ha pagado de verdad.'],
        ['¿Cuántos testigos conviene usar?',['Uno muy parecido','De 5 a 8','Más de 20'],1,'Con 5 a 8 parecidos se ve el rango sin mezclar pisos que no se parecen.'],
        ['Un piso sale caro y pasa dos meses sin visitas. ¿Qué suele pasar?',['Se vende igual','Se «quema»: los compradores lo descartan','Sube de precio'],1,'Cuanto más tiempo lleva, más sospecha el comprador y más rebaja pide.']],
  ej:'Valorad por separado 3 pisos anunciados en vuestra zona con la calculadora. Apuntad aquí vuestros dos precios y por qué difieren.'},
 {n:4,f:1,t:'Conseguir propietarios',dur:'1 sesión y todas las mañanas',
  obj:'Tener una entrada constante de propietarios que quieren vender, sin depender de la suerte.',
  claves:['**Vuestra ventaja: sois administradores de fincas.** En las comunidades sabéis antes que nadie quién vende, hereda o se muda. Con permiso del presidente: aviso en el portal, presencia en la junta, buena relación con el conserje.','**Farming de zona**: un barrio, siempre el mismo. Las mismas calles cada semana, buzoneo con algo útil (precios vendidos del barrio) y presentarse a comercios, bares y farmacias.','**Carteles de particulares**: acercarse en persona ofreciendo algo concreto (valoración por escrito, fotos).','**Referidos**: abogados de herencias, gestorías, asesores y bancos de la zona. Un café al mes con cada uno.','Apuntarlo **todo**: quien hoy dice «no» vende dentro de un año.'],
  pasos:['Elegid la zona y dibujad el recorrido de cada mañana.','Lista de las comunidades que administráis, con presidente y conserje.','Lista de 5 personas que os pueden pasar propietarios.','Cada mañana, 2 horas en la calle, y apuntar cada conversación.'],
  errores:['Abarcar todo Elche.','Hacer buzoneo un mes y dejarlo.','No volver a quien dijo «ahora no».'],
  test:[['¿Cuál es vuestra mayor ventaja para conseguir pisos?',['Anunciar en más portales','Las comunidades que ya administráis','Cobrar menos que nadie'],1,'Conocéis los edificios y a los vecinos: os enteráis antes de quién vende.'],
        ['¿Qué es el farming de zona?',['Buzonear todo Elche una vez','Trabajar siempre el mismo barrio, semana tras semana','Comprar listas de teléfonos'],1,'La constancia en un barrio es lo que hace que os llamen a vosotros.'],
        ['Un propietario os dice «ahora no». ¿Qué hacéis?',['Insistir hasta que diga que sí','Olvidarlo','Apuntarlo y volver cuando os haya dicho'],2,'Con fecha en el CRM. Muchos venden meses después.']],
  ej:'Esta semana: 100 puertas o comercios de vuestra zona, la lista de comunidades y 5 personas que os pasen propietarios. Apuntad aquí lo que habéis aprendido.'},
 {n:5,f:1,t:'La entrevista de captación y la exclusiva',dur:'2 sesiones y ensayos',
  obj:'Salir de la primera reunión con el piso en exclusiva y a un precio que se pueda vender.',
  claves:['**Primero preguntar** (20 minutos): por qué vende, para cuándo, qué hará después, si lo ha intentado ya y quién más decide.','**Después, el plan de venta** por escrito: precio con testigos, fotos y planos, portales, cartel, visitas filtradas e informe semanal.','**Pedir la exclusiva** sin rodeos: de 3 a 6 meses, con vuestros compromisos por escrito y la posibilidad de terminarla si no cumplís.','**Honorarios**: decirlos con naturalidad y no bajarlos en la primera reunión.','Si el propietario no acepta ni exclusiva ni un precio razonable, **se puede decir que no**.'],
  pasos:['Saludo y ver la casa (10 min).','Preguntas (20 min): el guion de Practicar.','Plan de venta (15 min).','Precio y honorarios (5 min).','Pedir la firma de la exclusiva.'],
  errores:['Empezar hablando de vosotros en vez de preguntar.','Dejar la nota de encargo para «otro día».','Aceptar un precio imposible por no perder el piso.'],
  test:[['¿Con qué se empieza la entrevista de captación?',['Hablando de la agencia','Preguntando y escuchando','Dando el precio'],1,'Hasta saber por qué vende y para cuándo, no sabéis qué ofrecerle.'],
        ['¿Cómo se plantea bien una exclusiva?',['Indefinida, para no perder el piso','Plazo corto, compromisos por escrito y la opción de terminarla','De palabra'],1,'El propietario firma más fácil si ve qué vais a hacer y que puede salirse si no cumplís.'],
        ['El propietario exige un precio que no se puede conseguir. ¿Qué hacéis?',['Aceptarlo y ya bajará','Enseñarle los testigos y, si no cambia, decir que no','Ofrecerle un descuento en honorarios'],1,'Un piso caro os quita tiempo y dinero y quema vuestro nombre en el barrio.']],
  ej:'Juego de rol grabado: uno hace de propietario difícil (entrenador de objeciones) y el otro capta. Cambiad de papel. Apuntad aquí qué objeción os cuesta más.'},
 {n:6,f:1,t:'Preparar el piso y el anuncio',dur:'1 sesión y práctica',
  obj:'Que el anuncio gane la comparación en el portal y traiga visitas buenas.',
  claves:['**Fotos**: con luz de día, gran angular sin deformar, persianas subidas y nada personal. 20–30 fotos; la mejor, la primera.','**Puesta a punto** sencilla: quitar trastos, despejar encimeras, una bombilla que funcione en cada cuarto.','**Plano** del piso y **certificado energético** con su etiqueta.','**Título que venda**: lo que lo hace distinto («Ático con terraza de 30 m² en Altabix»), no «Piso en venta».','**Portales**: en Elche se mueven sobre todo Idealista y Fotocasa [s]. El CRM los publica a la vez.'],
  pasos:['Lista de retoques al propietario dos días antes de las fotos.','Fotos con luz de día, de la puerta hacia dentro.','Plano, certificado y descripción con los datos que pregunta todo el mundo (gastos de comunidad, IBI, orientación).','Publicar y revisar a la semana: visitas, guardados y mensajes.'],
  errores:['Fotos con el móvil, de noche, con la cama sin hacer.','Copiar la descripción del propietario.','Publicar sin certificado energético.'],
  test:[['¿Cuándo se hacen las fotos?',['De noche, con todas las luces','Con luz de día y las persianas subidas','Cuando venga el comprador'],1,'La luz natural es lo que más vende en una foto de piso.'],
        ['¿Se puede anunciar sin certificado energético?',['Sí, se pide después','No, la etiqueta tiene que ir en el anuncio','Solo en alquiler'],1,'Es obligatorio para anunciar en venta y en alquiler.'],
        ['¿Qué título funciona mejor?',['«Piso en venta»','«Oportunidad única»','«Ático con terraza de 30 m² en Altabix»'],2,'El título tiene que decir lo que lo hace distinto de los otros 50 del portal.']],
  ej:'Haced las fotos y el anuncio completo de la casa de uno de vosotros. Comparadlo con los 5 mejores anuncios de la zona y apuntad aquí qué mejoraríais.'},
 {n:7,f:2,t:'Compradores: cualificar y enseñar',dur:'1 sesión y práctica',
  obj:'Enseñar el piso solo a quien puede y quiere comprarlo.',
  claves:['**Antes de la visita**: ¿necesita hipoteca y la tiene estudiada? ¿tiene que vender otro piso antes? ¿para cuándo? ¿quién más decide?','**Visitas agrupadas** en la misma franja: el comprador ve que hay interés.','**En la visita**: dejar mirar, contar lo que no se ve (orientación, comunidad, gastos) y preguntar qué le ha parecido.','**Hoja de visita firmada**, siempre.','**Seguimiento en menos de 24 horas**, y contárselo al propietario.'],
  pasos:['Cinco preguntas antes de dar cita (guion en Practicar).','Agrupar visitas en una franja.','Hoja de visita firmada.','Llamada al día siguiente.','Informe al propietario.'],
  errores:['Enseñar a todo el que llama.','No llamar después de la visita.','Hablar mal de otros pisos.'],
  test:[['¿Qué hacéis antes de dar una cita de visita?',['Nada, cuantas más visitas mejor','Cualificar: hipoteca, plazos y quién decide','Pedir una señal'],1,'Cada visita que no puede comprar os quita una hora y cansa al propietario.'],
        ['¿Para qué sirve la hoja de visita?',['Para nada, es papeleo','Para probar que el comprador llegó por vosotros','Para cobrar al comprador'],1,'Si luego intenta comprar sin vosotros, la hoja os protege.'],
        ['¿Cuándo se llama después de una visita?',['En menos de 24 horas','A la semana','Si llama él'],0,'Al día siguiente todavía se acuerda y podéis resolver dudas.']],
  ej:'Escribid vuestras 6 preguntas de cualificación y probadlas con 3 conocidos que busquen casa. Apuntad aquí lo que respondieron.'},
 {n:8,f:2,t:'Negociar y cerrar',dur:'2 sesiones',
  obj:'Llevar una oferta hasta la notaría sin que se caiga por el camino.',
  claves:['**Ofertas siempre por escrito**: precio, forma de pago, plazos y si depende de la hipoteca.','**Contraofertas**: llevarlas entre las partes sin decidir por ninguna. Vuestro trabajo es que se entiendan.','**Reserva → arras → notaría**: plazos claros y el documento de cada paso (módulo 1).','**Hipoteca y tasación**: si la tasación sale por debajo, el banco presta menos. Hablad antes de qué se hace en ese caso.','**Antes de la notaría**: nota simple al día, certificado de deudas de la comunidad, recibo del IBI, certificado energético y lo que pida el notario [c].','**Impuestos**: el comprador paga el ITP (o el IVA si es nueva); el vendedor, la plusvalía municipal y el IRPF de la ganancia. Los tipos, con la gestoría [c].'],
  pasos:['Oferta por escrito.','Contraoferta hasta el acuerdo.','Reserva y arras firmadas, diciendo de qué tipo son.','Tasación e hipoteca.','Papeles y cita en la notaría.','Reseña y referido el día de la firma.'],
  errores:['Ofertas de palabra.','Prometer plazos que dependen del banco.','Dar consejo fiscal: eso es de la gestoría.'],
  test:[['¿Cómo tiene que llegar una oferta?',['Por WhatsApp de voz','Por escrito, con precio, pago y plazos','De palabra en la visita'],1,'Lo que no está escrito no se puede presentar ni defender.'],
        ['La tasación sale por debajo del precio. ¿Qué pasa?',['Nada','El banco presta menos y el comprador tiene que poner más o renegociar','La venta se anula sola'],1,'Por eso hay que hablarlo antes de firmar las arras.'],
        ['El comprador os pregunta cuánto pagará de ITP exactamente.',['Se lo calculáis vosotros','Le mandáis a la gestoría o a su asesor','Le dais una cifra aproximada'],1,'No deis consejo fiscal: un error es responsabilidad vuestra.']],
  ej:'Simulad una operación entera con un piso inventado: oferta, contraoferta, reserva y arras, y la lista de papeles para la notaría. Apuntad aquí dónde os habéis atascado.'},
 {n:9,f:2,t:'Después de vender: reseñas y referidos',dur:'1 sesión',
  obj:'Que cada venta traiga la siguiente.',
  claves:['Pedir la **reseña en Google** el día de la firma, con el enlace directo en un mensaje.','Pedir un **referido** concreto: «¿Conoces a alguien que esté pensando en vender?».','Llamar al cabo de 1, 6 y 12 meses.','Ficha de Google Business con fotos, horario y respuesta a todas las reseñas.'],
  pasos:['Crear la ficha de Google Business.','Sacar el enlace directo para dejar reseña.','Mensaje de reseña preparado (Practicar).','Recordatorios a 1, 6 y 12 meses en el CRM.'],
  errores:['Desaparecer después de cobrar.','Pedir la reseña semanas después.'],
  test:[['¿Cuándo se pide la reseña?',['El día de la firma','Al mes','Nunca, queda mal'],0,'Es el día en que el cliente está más contento.'],
        ['¿Cómo se pide un referido?',['«Si sabes de algo, me dices»','«¿Conoces a alguien que esté pensando en vender?»','No se pide'],1,'Una pregunta concreta hace pensar en una persona concreta.']],
  ej:'Cread la ficha de Google Business de Tono e Hijo y pegad aquí el enlace para dejar reseña.'},
 {n:10,f:2,t:'Organizarse y medir',dur:'1 sesión y cada viernes',
  obj:'Saber cada semana qué funciona y qué no, con números y no con sensaciones.',
  claves:['**El embudo**: puertas → propietarios con los que habéis hablado → citas de valoración → captaciones → visitas → ofertas → arras → notaría.','**El viernes, 30 minutos**: cifras de la semana frente a los mínimos. Donde se rompe el embudo está el módulo que hay que repasar.','**Reparto entre los dos**: quién capta y quién comercializa cada inmueble, y cómo se reparte la comisión. Por escrito, en el pacto de socios.','**El CRM** guarda inmuebles, compradores y seguimientos. Esta guía dice qué hacer cada día.'],
  pasos:['Cada día, sumar en Hoy lo que hacéis.','El viernes, mirar los números y la calculadora del embudo.','Elegir un módulo para repasar.','Ajustar los objetivos con vuestros datos a partir del segundo mes.'],

var TITULO = {hoy:'Hoy', formacion:'Formación', modulo:'Módulo', practicar:'Practicar', objeciones:'Objeciones', guiones:'Guiones', guion:'Guion', calculadoras:'Calculadoras', honorarios:'Honorarios', valoracion:'Valoración', embudo:'Embudo', papeles:'Papeles', operaciones:'Operaciones', operacion:'Operación', arranque:'Arranque'};
var actual = {r:'inicio', n:0}, profundidad = 0;

}
function repintar(){ pintar(true); }

  if (d.copiar){ var txt = document.getElementById(d.copiar).innerText; try{ navigator.clipboard.writeText(txt).then(function(){ toast('Copiado'); }, function(){ seleccionar(d.copiar); }); }catch(err){ seleccionar(d.copiar); } return; }
  if (d.grande !== undefined){ G('grande', !S('grande', false)); repintar(); return; }

  if (d.testigoQuitar !== undefined){ var g = leerTestigos(); g.splice(+d.testigoQuitar, 1); if (!g.length) g.push(['','']); var cq = S('calc-val', {}); cq.t = g; cq.m2 = $('#v-m2').value; cq.aj = $('#v-aj').value; G('calc-val', cq); repintar(); return; }

  if (d.opConfirmar !== undefined){ var ops = S('ops', []); ops.splice(+d.opConfirmar, 1); G('ops', ops); toast('Operación borrada'); location.hash = 'operaciones'; return; }
});
function seleccionar(id){ var r = document.createRange(); r.selectNodeContents(document.getElementById(id)); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto seleccionado: cópialo'); }
document.addEventListener('change', function(e){

  if (d.ej){ PG('ej-' + d.ej, t.checked); if (t.checked && modEstado(MODULOS[d.ej - 1]).hecho) toast('Módulo ' + d.ej + ' hecho'); repintar(); return; }
  if (d.check){ var c = S('checks', {}); c[d.check] = t.checked; G('checks', c); if (actual.r === 'papeles') repintar(); return; }
  if (d.decis !== undefined){ var de = S('decis', {}); de[d.decis] = t.checked; G('decis', de); var su = t.closest('details').querySelector('.estado'); su.className = 'estado ' + (t.checked ? 'ok' : 'medio'); su.textContent = t.checked ? 'Decidido' : 'Pendiente'; return; }
